services:
  db:
    image: postgres:18
    restart: always
    container_name: sacco_system_db
    environment:
      # POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - sacco-system-net
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:


networks:
  sacco-system-net:
    driver: bridge
